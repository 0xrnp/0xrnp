<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; rx: 12px; stroke: #313244; stroke-width: 2px; }
      .bar { fill: #181825; }
      .text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; font-size: 13.5px; fill: #cdd6f4; }
      .dim { fill: #6c7086; }
      .mauve { fill: #cba6f7; font-weight: bold; }
      .green { fill: #a6e3a1; }
      .peach { fill: #fab387; }
      .blue { fill: #89b4fa; }
      .red { fill: #f38ba8; }
      .yellow { fill: #f9e2af; }
      .subtext { fill: #a6adc8; }
      .cursor { fill: #cba6f7; animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
    <clipPath id="window-clip">
      <rect width="920" height="340" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#window-clip)">
    <!-- Terminal Background -->
    <rect width="920" height="340" class="bg" />
    
    <!-- Top Window Bar -->
    <rect width="920" height="38" class="bar" />
    <circle cx="24" cy="19" r="6.5" fill="#f38ba8" />
    <circle cx="46" cy="19" r="6.5" fill="#f9e2af" />
    <circle cx="68" cy="19" r="6.5" fill="#a6e3a1" />
    <text x="460" y="24" text-anchor="middle" class="text dim" font-size="12.5px">ghostty — zsh — rnp@hyderabad: ~/0xrnp (tmux)</text>

    <!-- Left Pane: System Identity -->
    <text x="28" y="70" class="text">
      <tspan class="green">❯</tspan> <tspan class="blue">rnp</tspan> <tspan class="dim">--inspect --format=wal</tspan>
    </text>

    <text x="28" y="102" class="text"><tspan class="mauve">RNP(1)</tspan>                  <tspan class="dim">Systems & Backend Engineering</tspan></text>
    
    <text x="28" y="132" class="text"><tspan class="peach">host</tspan>        Rudra Narayan Panda <tspan class="dim">(0xrnp)</tspan></text>
    <text x="28" y="156" class="text"><tspan class="peach">role</tspan>        Software Engineer L2 @ <tspan class="green">ASBL</tspan></text>
    <text x="28" y="180" class="text"><tspan class="peach">prev</tspan>        Inncircles · Sambuq</text>
    <text x="28" y="204" class="text"><tspan class="peach">focus</tspan>       Low-latency Go, distributed queues, cloud cost</text>
    <text x="28" y="228" class="text"><tspan class="peach">stack</tspan>       Go · Rust · AWS · MongoDB · Postgres · Docker</text>
    <text x="28" y="252" class="text"><tspan class="peach">workflow</tspan>    Ghostty + Neovim + Tmux <tspan class="dim">(Catppuccin Mocha)</tspan></text>
    <text x="28" y="276" class="text"><tspan class="peach">motto</tspan>       <tspan class="yellow">"Sacrifice is the only way!"</tspan></text>

    <!-- Vertical Tmux Split Line -->
    <line x1="485" y1="38" x2="485" y2="340" stroke="#313244" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Right Pane: WAL Replay Metrics -->
    <text x="510" y="70" class="text">
      <tspan class="green">❯</tspan> <tspan class="blue">wal-replay</tspan> <tspan class="dim">./career.log --stats</tspan>
    </text>

    <text x="510" y="102" class="text dim">replayed 24 entries: 8 overwrites, 2 tombstones</text>

    <text x="510" y="132" class="text"><tspan class="blue">catalog_search</tspan>   <tspan class="red">1.8s</tspan> ➔ <tspan class="green">under 80ms (ES n-grams)</tspan></text>
    <text x="510" y="156" class="text"><tspan class="blue">hot_path_throughput</tspan> <tspan class="red">1x Node</tspan> ➔ <tspan class="green">3x (Go rewrite)</tspan></text>
    <text x="510" y="180" class="text"><tspan class="blue">mongodb_footprint</tspan> <tspan class="red">Atlas M60</tspan> ➔ <tspan class="green">M30 (-55% cost)</tspan></text>
    <text x="510" y="204" class="text"><tspan class="blue">incident_mttr</tspan>    <tspan class="red">hours</tspan> ➔ <tspan class="green">under 20 min</tspan></text>
    <text x="510" y="228" class="text"><tspan class="blue">notify_engine</tspan>    <tspan class="green">100K+ dispatches/day (Go)</tspan></text>
    <text x="510" y="252" class="text"><tspan class="blue">memtable_dirty</tspan>   <tspan class="mauve">Rust · Cassandra · SurrealDB</tspan></text>

    <text x="510" y="295" class="text">
      <tspan class="green">❯</tspan> <tspan class="subtext">echo $OPEN_QUESTION</tspan>
    </text>
    <text x="510" y="317" class="text dim">"what happens when a node dies mid-write?"</text>

    <!-- Active Prompt Left Pane -->
    <text x="28" y="312" class="text">
      <tspan class="green">❯</tspan> <tspan class="subtext">cargo test --release</tspan>
    </text>
    <rect x="200" y="299" width="8" height="16" class="cursor" />
  </g>
</svg>